<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 區 · 數據之門｜展覽控制</title>
<style>
:root{color-scheme:dark;--bg:#0b1423;--card:#121f32;--ink:#f2ece2;--muted:#a0aec0;--line:#33455a;--blue:#82afd6;--active:#203a56;--gold:#e8c58a;--orange:#f3a35e;--green:#e8c58a;--shadow:0 20px 70px #0004}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 3% 10%,#244b7355,transparent 55%),radial-gradient(ellipse at 100% 90%,#9f591d20,transparent 55%),var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.shell{max-width:1120px;min-height:100vh;margin:auto;padding:12px;display:flex;align-items:center}.panel{width:100%;background:linear-gradient(125deg,#1b2e4866,transparent 60%),var(--card);border:1px solid #b998632c;border-radius:30px;padding:32px;box-shadow:var(--shadow);position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:0 32px auto;height:1px;background:linear-gradient(90deg,transparent,#79a4cb99,#e8c58a99,#ef9c5799,transparent)}.panel-head{display:flex;align-items:center;gap:22px}.badge{display:grid;place-items:center;width:72px;height:72px;flex-shrink:0;background:linear-gradient(135deg,#304a66,#1b2d42);border:1px solid #bca47c44;border-radius:17px;font-weight:700;font-size:30px;color:var(--gold)}h2{font-size:27px;letter-spacing:1px;margin:0 0 5px;color:#f0d6aa}p{margin:0;color:var(--muted);line-height:1.7}.panel-status{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:13px;background:transparent;border:0;padding:8px 0 8px 12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#627287;margin-right:8px}.dot.live{background:var(--gold);box-shadow:0 0 9px #e8c58a55}.control-title{display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px;gap:10px}.control-title h3{margin:0;font-size:17px;font-weight:600;color:#c8d9e8}.control-title span{font-size:13px;color:var(--muted)}.power{display:grid;grid-template-columns:1fr 1fr;gap:16px}.power button{border:1px solid var(--line);border-radius:18px;background:#0d182530;padding:19px 22px;display:flex;align-items:center;gap:15px;text-align:left;min-height:99px;transition:background .15s,border-color .15s,box-shadow .15s}.power button:hover:enabled{border-color:#87a8c1;background:#23394f77}.power button.chosen{background:linear-gradient(110deg,#254665,#1d334b);border:2px solid #7da8d0;padding:18px 21px;box-shadow:inset 0 0 28px #406e9412}.power button[data-value="1"].chosen{background:linear-gradient(110deg,#73472044,#2b2d38);border-color:var(--orange);box-shadow:inset 0 0 30px #d9944120}.power .symbol{font-size:28px;color:var(--blue);line-height:1}.power button[data-value="1"] .symbol{color:var(--orange)}.power strong{display:block;font-size:18px;letter-spacing:.5px}.power small{display:block;color:var(--muted);font-size:13px;margin-top:6px}.power .check{margin-left:auto;font-size:18px;color:var(--gold);visibility:hidden}.power .chosen .check{visibility:visible}.scenes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.scene{border:1px solid var(--line);border-radius:18px;background:#0c172a22;padding:24px 18px;min-height:160px;text-align:left;position:relative;transition:background .15s,border-color .15s,box-shadow .15s}.scene:hover:enabled{border-color:#b3966a;background:#21375188}.scene.chosen{border:2px solid var(--gold);background:linear-gradient(145deg,#2c4864,#25354b 70%,#ad764220);padding:23px 17px;box-shadow:0 0 20px #dab37110,inset 0 0 30px #d8b17209}.scene .number{font-size:34px;font-weight:600;display:block;color:var(--blue);letter-spacing:1px}.scene.chosen .number{color:var(--gold)}.scene strong{font-size:17px;display:block;margin:14px 0 7px;font-weight:600}.scene small{font-size:13px;color:var(--muted)}.scene .check{position:absolute;right:17px;top:23px;visibility:hidden;color:var(--gold);font-size:18px}.scene.chosen .check{visibility:visible}.feedback{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-top:1px solid #c4a87833;padding-top:24px;margin-top:30px;font-size:13px;color:var(--muted)}.feedback b{color:#eed5aa;font-weight:600}.message{min-height:24px;color:#9eb2c8;font-size:13px;line-height:1.7;margin:18px 0 0}.message.error{color:#ffa677}dialog{border:1px solid #b7986666;border-radius:22px;background:var(--card);color:var(--ink);padding:28px;width:min(440px,90vw);box-shadow:0 30px 100px #0008}dialog::backdrop{background:#020a17aa}dialog h2{font-size:22px}label{display:block;margin-top:18px;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.actions button{padding:10px 18px;background:var(--active);border:1px solid var(--line);border-radius:10px}.actions button[type="submit"]{border-color:#d9b37699;color:var(--gold)}
@media(max-width:1000px){.panel{padding:28px}.scenes{gap:12px}.scene{padding:23px 16px}.scene.chosen{padding:22px 15px}.feedback{gap:20px}}@media(max-width:650px){.shell{padding:10px;align-items:flex-start}.panel{padding:24px 18px;border-radius:24px}.badge{width:55px;height:55px;font-size:26px}.panel-head{gap:14px}h2{font-size:22px}.panel-status{font-size:12px;padding-left:4px}.control-title{margin-top:28px}.control-title h3{font-size:15px}.control-title span{font-size:11px}.power{gap:10px}.power button{padding:15px 12px;gap:9px;min-height:90px}.power button.chosen{padding:14px 11px}.power strong{font-size:14px}.power small{font-size:11px}.power .symbol{font-size:23px}.power .check{font-size:15px}.scenes{grid-template-columns:repeat(2,1fr);gap:12px}.scene{min-height:132px;padding:18px}.scene.chosen{padding:17px}.scene .number{font-size:30px}.scene strong{margin-top:10px}.scene:last-child{grid-column:1/-1;min-height:116px}.feedback{gap:12px;font-size:12px}.message{font-size:12px}.panel:before{left:18px;right:18px}}@media(min-width:651px) and (max-height:700px){.shell{align-items:flex-start}.panel{padding:26px}.scene{min-height:135px}.control-title{margin-top:25px}.power button{min-height:90px}}

.settings-label{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--gold);margin-top:5px}.settings-icon{width:18px;height:18px;flex-shrink:0}
</style></head><body><main class="shell">
<section class="panel"><div class="panel-head"><div class="badge">A</div><div><h2>數據之門</h2><p style="font-size:13px">策展轉場空間</p></div><button class="panel-status" id="settings" aria-label="OSC 設定" title="OSC 設定"><i id="panelDot" class="dot"></i><span id="panelState">等待連線</span><span class="settings-label"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.7" ry="10"/><path d="M12 2v20M3.3 7h17.4M2 12h20M3.3 17h17.4"/></svg><span>OSC 設定</span></span></button></div>
<div class="control-title"><h3>總控測試 · A 區開／關</h3><span id="viewValue">—</span></div>
<div class="power" role="group" aria-label="A 區開關"><button data-kind="view" data-value="0" aria-pressed="false"><span class="symbol">◯</span><span><strong>NO_VIEW</strong><small>關閉投放 · 黑畫面</small></span><span class="check">✓</span></button><button data-kind="view" data-value="1" aria-pressed="false"><span class="symbol">◉</span><span><strong>顯示 1–5 幕</strong><small>開啟投放 · 目前幕次</small></span><span class="check">✓</span></button></div>
<div class="control-title"><h3>幕次選擇</h3><span>選定後保持播放</span></div>
<div class="scenes" role="group" aria-label="幕次選擇">
<button class="scene" data-kind="scene" data-value="0" aria-pressed="false"><span class="number">01</span><span class="check">✓</span><strong>Scene 1</strong><small>第一幕</small></button><button class="scene" data-kind="scene" data-value="1" aria-pressed="false"><span class="number">02</span><span class="check">✓</span><strong>Scene 2</strong><small>第二幕</small></button><button class="scene" data-kind="scene" data-value="2" aria-pressed="false"><span class="number">03</span><span class="check">✓</span><strong>Scene 3</strong><small>第三幕</small></button><button class="scene" data-kind="scene" data-value="3" aria-pressed="false"><span class="number">04</span><span class="check">✓</span><strong>Scene 4</strong><small>第四幕</small></button><button class="scene" data-kind="scene" data-value="4" aria-pressed="false"><span class="number">05</span><span class="check">✓</span><strong>Scene 5</strong><small>第五幕</small></button></div>
<div class="feedback" aria-live="polite"><span>目前幕次　<b id="actualScene">—</b></span><span>A 區投放　<b id="actualView">—</b></span><span>左右牆同步　<b id="bSync">等待回報</b></span><span>地面　<b id="floorSync">—</b></span></div><div class="message" id="message" role="status">請開啟 A、B TouchDesigner 與 Web 橋接服務。</div></section>
</main>
<dialog id="configDialog"><form id="configForm"><h2>OSC 設定</h2><p style="font-size:13px;margin-top:8px">在 TD 電腦啟動轉送服務，再填入該電腦 IP。</p><label>TD 電腦 IP<input id="bridge" type="text" inputmode="decimal" required placeholder="192.168.200.143" autocomplete="off"></label><p style="font-size:12px;margin-top:8px">手機與電腦需在可互通的同一網路。</p><a href="./A_OSC_RELAY.py" download style="display:block;color:var(--gold);font-size:13px;margin-top:16px">下載電腦轉送服務碼</a><div id="configError" class="message error"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit">連線</button></div></form></dialog>
<script type="module">
import {bridgeOrigin,requestBridge,initialBridge,relayInput} from './bridge-client.mjs?v=ip-relay-1';
const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-kind]')];let busy=false,connected=false,lastStatus=null,pending=null;
const published=location.hostname.endsWith('.github.io');let bridgeBase=initialBridge({published,origin:location.origin}),connectionVersion=0;
try{bridgeBase=initialBridge({published,origin:location.origin,saved:localStorage.getItem('a-zone-bridge')||'',presetApplied:localStorage.getItem('a-zone-ip-preset')==='v1'});if(published){localStorage.setItem('a-zone-bridge',bridgeBase);localStorage.setItem('a-zone-ip-preset','v1');}localStorage.removeItem('a-zone-phone-code');}catch{}
async function api(url,data){return requestBridge(bridgeBase,url,data);}
function disconnected(){connected=false;controls();$('panelDot').classList.remove('live');$('panelState').textContent='橋接未連線';for(const b of buttons){b.classList.remove('chosen');b.setAttribute('aria-pressed','false');}$('viewValue').textContent='—';$('actualScene').textContent='—';$('actualView').textContent='—';$('bSync').textContent='等待回報';$('floorSync').textContent='—';}
function controls(){for(const b of buttons)b.disabled=busy||!connected;}
function render(s){lastStatus=s;connected=s.connected;const v=s.state;$('panelDot').classList.toggle('live',connected);$('panelState').textContent=connected?'已連線':'等待連線';
 for(const b of buttons){const chosen=connected&&Number(b.dataset.value)===(b.dataset.kind==='scene'?v.sceneIndex:v.view);b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen));}
 $('actualScene').textContent=v?'Scene '+(v.sceneIndex+1)+(connected?'':' · 最後狀態'):'—';$('actualView').textContent=v?(v.view?'開啟':'關閉')+(connected?'':' · 最後狀態'):'—';$('viewValue').textContent=connected?(v.view?'ON':'OFF'):'—';$('bSync').textContent=connected?(v.bSceneConfirmed&&v.bViewConfirmed?'已同步':'等待 B 回報'):'等待回報';$('floorSync').textContent=connected?(Number.isInteger(v.floorSceneIndex)?'Scene '+(v.floorSceneIndex+1):'未接入'):'—';controls();
 if(pending&&connected&&v[pending.kind==='scene'?'sceneIndex':'view']===pending.value){$('message').textContent=pending.kind==='scene'?'已切換至 Scene '+(pending.value+1):pending.value?'A 區已開啟投放':'A 區已關閉投放';$('message').className='message';pending=null;}
 if(pending&&Date.now()-pending.at>4000){$('message').textContent='命令已送出，尚未確認 TD 狀態，請檢查連線後重試。';$('message').className='message error';pending=null;}
 if(connected&&!pending&&['請開啟 A、B TouchDesigner 與 Web 橋接服務。','無法連接 Web 橋接服務，請確認 START-WEB.cmd 正在執行。'].includes($('message').textContent)){$('message').textContent='A 區控制已就緒';$('message').className='message';}
}
async function poll(){const version=connectionVersion;try{const state=await api('/api/status');if(version!==connectionVersion)return;render(state);if(connected&&!pending&&$('message').classList.contains('error')){$('message').textContent='A 區控制已就緒';$('message').className='message';}}catch(error){if(version!==connectionVersion)return;disconnected();$('message').textContent=location.protocol==='file:'?'請透過 START-WEB.cmd 啟動，再開啟 http://localhost:8788/A_ZONE_OSC.html':!bridgeBase?'請點 OSC 設定，填入 TD 電腦 IP。':published?'無法連到轉送服務，請確認電腦已啟動服務及手機網路；若 Safari 阻擋 HTTP，需使用已信任的 HTTPS 轉送網址。':'無法連接 Web 橋接服務，請確認 START-WEB.cmd 正在執行。';$('message').className='message error';}finally{setTimeout(poll,700);}}
for(const b of buttons)b.addEventListener('click',async()=>{busy=true;controls();const cmd={kind:b.dataset.kind,value:Number(b.dataset.value)};try{await api('/api/command',cmd);pending={...cmd,at:Date.now()};$('message').textContent='命令已送出，等待 TD 回報…';$('message').className='message';render(await api('/api/status'));}catch(error){$('message').textContent=error.message;$('message').className='message error';}finally{busy=false;controls();}});
$('settings').onclick=()=>{$('bridge').value=relayInput(bridgeBase);$('configError').textContent='';$('configDialog').showModal();};$('cancel').onclick=()=>$('configDialog').close();$('configForm').onsubmit=async e=>{e.preventDefault();try{const next=bridgeOrigin($('bridge').value);if(!next)throw Error('請填入 TD 電腦 IP');bridgeBase=next;connectionVersion++;lastStatus=null;pending=null;disconnected();try{localStorage.setItem('a-zone-bridge',next);localStorage.setItem('a-zone-ip-preset','v1');}catch{}$('configDialog').close();$('message').textContent='正在連接轉送服務…';$('message').className='message';try{render(await api('/api/status'));$('message').textContent=connected?'A 區控制已就緒':'轉送服務已連線，等待 TD 回報。';}catch{$('message').textContent='無法連到此 IP 的轉送服務，請確認電腦已啟動服務及手機網路。';$('message').className='message error';}}catch(error){$('configError').textContent=error.message;}};
controls();poll();
</script></body></html>
